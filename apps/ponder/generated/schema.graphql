"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  market(id: String!): market
  markets(where: marketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): marketPage!
  position(id: String!): position
  positions(where: positionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): positionPage!
  vault(id: String!): vault
  vaults(where: vaultFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): vaultPage!
  _meta: Meta
}

type market {
  id: String!
  chainId: Int!
  loanToken: String!
  collateralToken: String!
  oracle: String!
  irm: String!
  lltv: BigInt!
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  lastUpdate: BigInt!
  fee: BigInt!
}

type marketPage {
  items: [market!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

