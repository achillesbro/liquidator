# Docker Compose for Morpho Bot (EREBUS) - VPS Deployment
# Usage: docker compose -f deploy/docker-compose.morpho.yml up -d

services:
  erebus-morpho:
    build:
      context: ..
      dockerfile: apps/morpho-bot/Dockerfile
    container_name: erebus-morpho
    restart: unless-stopped
    env_file:
      - .env.morpho
    ports:
      # Bind health port to localhost only for security
      - "127.0.0.1:4001:4001"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health | grep -q 'status'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
